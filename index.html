<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Wireframes that show where the workflow runtime's admin context and user inbox live relative to the Integration Control Plane.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='1' width='14' height='14' rx='2' fill='none' stroke='%23444' stroke-width='1.5' stroke-dasharray='3 2'/></svg>">

<body>
  <header class="top">
    <a class="brand" href="#/">Workflow portals <span>storyboard</span></a>
    <nav class="tabs" id="tabs">

      <a href="#/icp">ICP</a>
      <a href="#/admin">Admin context</a>
